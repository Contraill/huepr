# Submits a new version to addons.mozilla.org (listed channel) and opens the
# GitHub release. Triggered by pushing an annotated tag like v2.2.0 whose
# version matches manifest.json; the tag message becomes the release notes.
# The signed XPI is attached by publish-approved.yml once Mozilla approves it.
#
# Secrets live in the "huepr-release" environment (Settings → Environments):
#   AMO_API_KEY, AMO_API_SECRET  — https://addons.mozilla.org/developers/addon/api/key/
#   RELEASE_TOKEN (optional)     — fine-grained token with "Contents: Read and write";
#                                  makes the release show your account instead of github-actions
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: huepr-release
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches manifest version
        run: |
          VERSION="$(jq -r .version manifest.json)"
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release notes from the tag message
        run: |
          # checkout can store the tag as lightweight; fetch the annotated tag object
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          [[ -s notes.md ]] || { echo "::error::Tag $GITHUB_REF_NAME has no message (use git tag -a)"; exit 1; }
          python3 - <<'PY'
          import json
          meta = json.load(open("amo-metadata.json"))
          meta["version"]["release_notes"] = {"en-US": open("notes.md").read().strip()}
          json.dump(meta, open("amo-metadata.release.json", "w"))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit to AMO (listed)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          # AMO credentials never contain whitespace; drop any pasted along.
          WEB_EXT_API_KEY="$(printf %s "$WEB_EXT_API_KEY" | tr -d '[:space:]')"
          WEB_EXT_API_SECRET="$(printf %s "$WEB_EXT_API_SECRET" | tr -d '[:space:]')"
          export WEB_EXT_API_KEY WEB_EXT_API_SECRET
          # Listed versions are signed after review, so don't wait for the file.
          npx --yes web-ext@8 sign --source-dir . --artifacts-dir dist \
            --channel listed --amo-metadata amo-metadata.release.json \
            --approval-timeout 0

      - name: Open GitHub release
        run: |
          printf '\n\n_The signed `huepr-%s.xpi` is attached here once Mozilla approves this version on addons.mozilla.org._\n' "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
